<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in · SmartPark Operations</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="login-page">
      <form class="card login-card" id="loginForm">
        <div class="brand" style="color: #142033">
          SmartPark<small style="color: #2b7fff"
            >Operations Control Center</small
          >
        </div>
        <h1 style="margin-top: 24px">Welcome back</h1>
        <p>
          Secure dashboard for Katy's site operations, sourcing, technician and
          cost analytics.
        </p>
        <div class="field">
          <label>Username</label
          ><input
            name="username"
            autocomplete="username"
            value="KatyH"
            required
          />
        </div>
        <div class="field">
          <label>Password</label
          ><input
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn primary" type="submit">Sign in</button>
        <div class="error" id="err"></div>
        <p style="font-size: 11px">
          The included demo password must be replaced before production
          deployment.
        </p>
      </form>
    </div>
    <script src="/js/login.js"></script>
  </body>
</html>
